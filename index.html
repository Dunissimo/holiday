<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Holiday Glow — архитектурная подсветка под ключ</title>
    <meta
      name="description"
      content="Комплексная архитектурная подсветка под ключ: проектирование, монтаж и сервисное обслуживание для коммерческих объектов, ТЦ и коттеджей."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="logo" href="#about">Holiday Glow</a>
        <nav class="nav" id="site-nav" aria-label="Основное меню"></nav>
        <div class="header-actions">
          <a class="icon-btn" data-phone aria-label="Позвонить">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
              <path d="M6.6 3.8c.4-.8 1.4-1 2.1-.5l2 1.5c.7.5.9 1.5.4 2.2L10 9.2a12.4 12.4 0 0 0 4.8 4.8l2.2-1.1c.7-.4 1.7-.2 2.2.4l1.5 2c.5.8.3 1.8-.5 2.2l-1.7 1c-1 .6-2.3.5-3.4-.1A18.6 18.6 0 0 1 5.7 8.9c-.6-1.1-.7-2.4-.1-3.4l1-1.7Z" />
            </svg>
          </a>
          <a class="icon-btn" data-telegram target="_blank" rel="noreferrer" aria-label="Написать в Telegram">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
              <path d="M21 5 3.4 12.2c-.8.3-.8 1.4 0 1.7l4.4 1.6 1.7 4.6c.3.8 1.4.9 1.8.1L13 17l4.8 3.5c.7.5 1.7 0 1.8-.8L21 5Z" />
              <path d="m9.6 13.8 8.2-6.2" />
            </svg>
          </a>
          <button class="burger" type="button" aria-expanded="false" aria-label="Открыть меню">
            <span></span><span></span><span></span>
          </button>
        </div>
      </div>
    </header>

    <main>
      <section class="hero" id="about">
        <div class="container hero-copy">
          <h1></h1>
          <p class="hero-lead"></p>
          <div class="perks"></div>
        </div>
      </section>

      <section class="section services" id="services">
        <div class="container">
          <h2 class="section-title">Наши услуги</h2>
          <div class="services-grid" id="services-grid"></div>
        </div>
      </section>

      <section class="section" id="portfolio">
        <div class="container">
          <h2 class="section-title">Портфолио</h2>
          <div class="portfolio-grid" id="portfolio-grid"></div>
        </div>
      </section>

      <section class="steps" id="steps">
        <div class="steps-stack" id="steps-row"></div>
        <div class="container">
          <div class="cta-band">
            <button class="btn" type="button" data-open-modal="request">Получить расчёт →</button>
          </div>
          <div class="clients" id="clients">
            <h2 class="section-title">Нам доверяют</h2>
            <div class="clients-grid" id="clients-grid"></div>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <a class="logo" href="#about">Holiday Glow</a>
        <nav class="footer-nav" id="footer-nav"></nav>
      </div>
    </footer>

    <div class="modal" id="request-modal" role="dialog" aria-modal="true" aria-labelledby="request-title" aria-hidden="true">
      <div class="modal-backdrop" data-close-modal></div>
      <div class="modal-dialog">
        <button class="modal-close" type="button" data-close-modal aria-label="Закрыть">×</button>
        <h2 id="request-title">Получить расчёт</h2>
        <p>Оставьте контакты — вернёмся с ориентиром по срокам и стоимости.</p>
        <form id="request-form">
          <label class="field">
            <span>Имя</span>
            <input name="name" type="text" autocomplete="name" required />
          </label>
          <label class="field">
            <span>Телефон</span>
            <input name="phone" type="tel" autocomplete="tel" required />
          </label>
          <label class="field">
            <span>Комментарий</span>
            <textarea name="comment" placeholder="Объект, сроки, пожелания"></textarea>
          </label>
          <button class="btn" type="submit">Отправить</button>
          <p class="form-success" id="request-success">Заявка принята. Мы свяжемся с вами.</p>
        </form>
      </div>
    </div>

    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Просмотр видео" aria-hidden="true">
      <div class="lightbox-backdrop" data-close-lightbox></div>
      <button class="lightbox-close" type="button" data-close-lightbox aria-label="Закрыть">×</button>
      <video id="lightbox-video" controls playsinline></video>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
